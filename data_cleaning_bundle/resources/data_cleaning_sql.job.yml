# A job running SQL queries on a SQL warehouse
resources:
  jobs:
    data-cleaning-platform_sql_job:
      name: data-cleaning-platform_sql_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      email_notifications:
        on_failure:
          - shungubepearlzinhle@gmail.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: bundle_target
          default: ${bundle.target}

      tasks:
        - task_key: bronze
          notebook_task:
            warehouse_id: ${var.warehouse_id}
            notebook_path: ${workspace.file_path}/src/bronze.ipynb

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            warehouse_id: ${var.warehouse_id}
            notebook_path: ${workspace.file_path}/src/silver.ipynb

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            warehouse_id: ${var.warehouse_id}
            notebook_path: ${workspace.file_path}/src/gold.ipynb


